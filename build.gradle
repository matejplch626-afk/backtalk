// For building the open-source release of TalkBack.

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.compose) apply false
}

apply from: 'shared.gradle'

apply from: 'version.gradle'

final BUILD_TIMESTAMP = new Date().format('yyyy_MM_dd_HHmm')

dependencies {
    implementation project(':talkback')
}

android {
    namespace = "com.android.talkback"
    defaultConfig {
        applicationId = talkbackApplicationId
        versionCode = backtalkVersionCodeBase + gitCommitCount
        versionName = talkbackVersionName + "-" + BUILD_TIMESTAMP
        minSdk = 26
        targetSdk = 36
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
        multiDexEnabled = true
    }
    buildTypes {
        // The published builds are debug builds, signed with the debug key. Android runs a
        // debuggable app without compiling it, which makes navigation several times slower on
        // a watch, so they are not debuggable. Debug logging in the libraries stays on.
        debug {
            debuggable = false
            // Shrinks and optimizes the libraries, so there is less code to load and compile.
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += ['LICENSE', 'README']
        }
        jniLibs {
            // On-device AI only runs on arm64-v8a (see OnDeviceAiSettings), so its 26 MB library
            // would never load on x86_64.
            excludes += ['lib/x86_64/liblitertlm_jni.so']
        }
    }
    lint {
        checkReleaseBuilds = false
        // Lint the library modules too, where most of the code is, in one report.
        checkDependencies = true
        // The issues that were already there when lint was added to CI. Only new ones fail the
        // build. To accept new ones on purpose, run ./gradlew updateLintBaselinePhoneDebug.
        baseline = file("lint-baseline.xml")
        abortOnError = true
    }
    productFlavors {
        phone {
            dimension = "target"
        }
        wear {
            dimension = "target"
            versionNameSuffix = "-wear"
        }
    }
}

// Temporary CI-only experiment: regenerate the canonical lint baseline, then remove only
// diagnostic display attributes to test whether lint can match a transport-safe compact form.
tasks.register("compactGeneratedLintBaseline") {
    dependsOn("updateLintBaselinePhoneDebug")
    doLast {
        def baselineFile = file("lint-baseline.xml")
        def text = baselineFile.getText("UTF-8")
        text = text.replaceAll(/ message="[^"]*"/, "")
        text = text.replaceAll(/ errorLine1="[^"]*"/, "")
        text = text.replaceAll(/ errorLine2="[^"]*"/, "")
        text = text.replaceAll(/ line="[^"]*"/, "")
        text = text.replaceAll(/ column="[^"]*"/, "")
        baselineFile.setText(text, "UTF-8")
    }
}

tasks.register("captureGeneratedLintBaseline") {
    doLast {
        copy {
            from file("lint-baseline.xml")
            into file("${buildDir}/outputs/apk/baseline")
            rename { "lint-baseline.xml.apk" }
        }
    }
}

tasks.matching { it.name == "assembleDebug" }.configureEach {
    dependsOn("compactGeneratedLintBaseline")
    finalizedBy("captureGeneratedLintBaseline")
}
