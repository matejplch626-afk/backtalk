name: Czech translation audit and build

on:
  push:
    branches: [czech-translation]
  pull_request:
    branches: [czech-translation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Audit changed existing translatable resources
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET

          since = '2026-09-25'
          commits = subprocess.check_output(
              ['git','log',f'--since={since}','--format=%H'], text=True
          ).splitlines()

          string_re = re.compile(r'<string\s+[^>]*name="([^"]+)"[^>]*>(.*?)</string>')
          changed = {}

          for sha in reversed(commits):
              parent = subprocess.run(['git','rev-parse',f'{sha}^'], text=True, capture_output=True)
              if parent.returncode != 0:
                  continue
              diff = subprocess.check_output(
                  ['git','show','--format=','--unified=0',sha,'--','*/src/*/res/values/*.xml','*/res/values/*.xml'],
                  text=True, errors='replace'
              )
              current_file = None
              removed = {}
              added = {}
              for line in diff.splitlines():
                  if line.startswith('+++ b/'):
                      current_file = line[6:]
                      continue
                  if not current_file or '/values-' in current_file or not '/res/values/' in current_file:
                      continue
                  if line.startswith('-') and not line.startswith('---'):
                      m = string_re.search(line[1:].strip())
                      if m:
                          removed.setdefault((current_file,m.group(1)), []).append(m.group(2))
                  elif line.startswith('+') and not line.startswith('+++'):
                      m = string_re.search(line[1:].strip())
                      if m:
                          added.setdefault((current_file,m.group(1)), []).append(m.group(2))
              for key in set(removed) & set(added):
                  old = removed[key][-1]
                  new = added[key][-1]
                  if old != new:
                      changed[(sha,key[0],key[1])] = (old,new)

          cs = {}
          for p in Path('.').rglob('res/values-cs/*.xml'):
              try:
                  root = ET.parse(p).getroot()
              except Exception as e:
                  print(f'XML_PARSE_ERROR\t{p}\t{e}')
                  continue
              for child in root:
                  name = child.attrib.get('name')
                  if name:
                      text = ''.join(child.itertext()).strip()
                      cs.setdefault(name, []).append((str(p), text))

          out = []
          out.append('CHANGED EXISTING ENGLISH STRING RESOURCES SINCE 2026-09-25')
          out.append('')
          for (sha,path,name),(old,new) in changed.items():
              out.append(f'{sha[:10]}\t{path}\t{name}')
              out.append(f'  OLD: {old}')
              out.append(f'  NEW: {new}')
              vals = cs.get(name, [])
              if vals:
                  for cp,cv in vals:
                      out.append(f'  CS [{cp}]: {cv}')
              else:
                  out.append('  CS: <missing>')
              out.append('')

          duplicates = []
          by_dir = {}
          for p in Path('.').rglob('res/values-cs/*.xml'):
              try:
                  root = ET.parse(p).getroot()
              except Exception:
                  continue
              d = str(p.parent)
              bucket = by_dir.setdefault(d,{})
              for child in root:
                  name = child.attrib.get('name')
                  if name:
                      bucket.setdefault(name,[]).append(str(p))
          for d,bucket in by_dir.items():
              for name,paths in bucket.items():
                  if len(paths) > 1:
                      duplicates.append((d,name,paths))
          out.append('DUPLICATE CZECH RESOURCE NAMES')
          if duplicates:
              for d,name,paths in duplicates:
                  out.append(f'{d}\t{name}\t' + ' | '.join(paths))
          else:
              out.append('None')

          Path('czech-audit.txt').write_text('\n'.join(out), encoding='utf-8')
          print('\n'.join(out))
          PY

      - name: Validate XML files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          failures=[]
          for p in Path('.').rglob('res/values-cs/*.xml'):
              try:
                  ET.parse(p)
              except Exception as e:
                  failures.append(f'{p}: {e}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('All Czech values XML files are well-formed.')
          PY

      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: czech-audit-and-apks
          path: |
            czech-audit.txt
            build/outputs/apk/**/*.apk
          if-no-files-found: warn
