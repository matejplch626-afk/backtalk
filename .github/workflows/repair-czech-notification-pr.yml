name: Repair Czech notification PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'czech-notification-repair-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: czech-notification-list
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore clean project files
        shell: bash
        run: |
          set -euo pipefail
          git checkout 2eddbf0364ea4fd6f400ca138285c9473b6c78ce -- build.gradle
          if [ -f .github/workflows/fix-czech-notification-lint.yml ]; then
            git rm .github/workflows/fix-czech-notification-lint.yml
          fi
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('talkback/src/main/res/values-cs/strings_notification_list.xml')
          root = ET.parse(p).getroot()
          names = [e.attrib['name'] for e in root if e.tag in ('string', 'plurals')]
          if len(names) != 23 or len(set(names)) != 23:
              raise SystemExit(f'Expected exactly 23 unique Czech resources, got {len(names)} / {len(set(names))}.')
          text = p.read_text(encoding='utf-8')
          if '<item quantity="many">%d oznámení</item>' not in text:
              raise SystemExit('Czech quantity="many" is missing.')
          PY
          git diff --check

      - name: Regenerate lint baseline
        run: ./gradlew updateLintBaselinePhoneDebug --console=plain

      - name: Validate generated baseline
        run: git diff --check

      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      - name: Run unit tests
        run: ./gradlew testPhoneDebugUnitTest --console=plain

      - name: Run lint
        run: ./gradlew :lintPhoneDebug --console=plain

      - name: Commit verified repair to working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint-baseline.xml build.gradle talkback/src/main/res/values-cs/strings_notification_list.xml
          git add -u .github/workflows/fix-czech-notification-lint.yml 2>/dev/null || true
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair changes to commit."
          else
            git commit -m "Finalize Czech notification list translations"
            git push origin HEAD:czech-notification-list
          fi
