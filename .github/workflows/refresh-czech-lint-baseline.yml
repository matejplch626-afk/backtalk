name: Refresh Czech lint baseline

on:
  push:
    branches: [ "czech-translation" ]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh exact stale Czech MissingTranslation entries
        shell: python
        run: |
          from pathlib import Path
          import re

          # Each tuple comes from two concrete sources:
          # - baseline_path/baseline_line: exact location printed from lint-baseline.xml
          # - current_line: exact location in the current lint-results-phoneDebug report
          # script_sources intentionally has expected_count=2 because the baseline contains
          # two identical stale entries for that same exact resource and location.
          entries = [
              ("battery_optimization_notification_title", "src/main/res/values/strings.xml", 177, 177, 1),
              ("battery_optimization_notification_text", "src/main/res/values/strings.xml", 179, 179, 1),
              ("permission_braille_display_label", "src/main/res/values/strings.xml", 411, 424, 1),
              ("permission_braille_display_description", "src/main/res/values/strings.xml", 413, 426, 1),
              ("external_display_channel", "braille/brailledisplay/src/phone/res/values/strings.xml", 870, 870, 1),
              ("external_display_ask_title", "braille/brailledisplay/src/phone/res/values/strings.xml", 872, 872, 1),
              ("external_display_ask_text", "braille/brailledisplay/src/phone/res/values/strings.xml", 874, 874, 1),
              ("external_display_warning", "braille/brailledisplay/src/phone/res/values/strings.xml", 876, 876, 1),
              ("external_display_allow", "braille/brailledisplay/src/phone/res/values/strings.xml", 878, 878, 1),
              ("external_display_deny", "braille/brailledisplay/src/phone/res/values/strings.xml", 880, 880, 1),
              ("external_display_in_use_title", "braille/brailledisplay/src/phone/res/values/strings.xml", 882, 882, 1),
              ("external_display_in_use_text", "braille/brailledisplay/src/phone/res/values/strings.xml", 884, 884, 1),
              ("external_displays_title", "braille/brailledisplay/src/phone/res/values/strings.xml", 886, 886, 1),
              ("external_displays_summary", "braille/brailledisplay/src/phone/res/values/strings.xml", 888, 888, 1),
              ("external_displays_none", "braille/brailledisplay/src/phone/res/values/strings.xml", 890, 890, 1),
              ("title_clear_selection", "src/main/res/values/strings.xml", 1979, 1996, 1),
              ("script_sources", "src/main/res/values/strings_scripts.xml", 256, 256, 2),
              ("script_sources_none", "src/main/res/values/strings_scripts.xml", 258, 258, 1),
              ("script_source_add", "src/main/res/values/strings_scripts.xml", 260, 260, 1),
              ("script_source_add_button", "src/main/res/values/strings_scripts.xml", 262, 262, 1),
              ("script_source_hint", "src/main/res/values/strings_scripts.xml", 264, 264, 1),
              ("script_source_invalid", "src/main/res/values/strings_scripts.xml", 266, 266, 1),
              ("script_source_exists", "src/main/res/values/strings_scripts.xml", 268, 268, 1),
              ("script_source_loading", "src/main/res/values/strings_scripts.xml", 270, 270, 1),
              ("script_source_empty", "src/main/res/values/strings_scripts.xml", 272, 272, 1),
              ("script_source_failed", "src/main/res/values/strings_scripts.xml", 274, 274, 1),
              ("script_source_retry", "src/main/res/values/strings_scripts.xml", 276, 276, 1),
              ("script_source_downloading", "src/main/res/values/strings_scripts.xml", 278, 278, 1),
              ("script_source_remove", "src/main/res/values/strings_scripts.xml", 280, 280, 1),
              ("script_source_remove_title", "src/main/res/values/strings_scripts.xml", 282, 282, 1),
              ("script_source_remove_message", "src/main/res/values/strings_scripts.xml", 284, 284, 1),
          ]

          path = Path("lint-baseline.xml")
          text = path.read_text(encoding="utf-8")
          token = "&quot;cs&quot; (Czech)"
          blocks = re.findall(r'<issue\b.*?</issue>', text, flags=re.S)
          changed_blocks = 0

          for key, baseline_path, baseline_line, current_line, expected_count in entries:
              marker = f'message="&quot;{key}&quot; is not translated'
              file_marker = f'file="{baseline_path}"'
              line_marker = f'line="{baseline_line}"'
              candidates = [
                  b for b in blocks
                  if marker in b and file_marker in b and line_marker in b and token in b
              ]
              if len(candidates) != expected_count:
                  raise SystemExit(
                      f"{key}: expected {expected_count} exact stale block(s) at "
                      f"{baseline_path}:{baseline_line}, found {len(candidates)}"
                  )

              for block in candidates:
                  block2 = block
                  if f", {token}" in block2:
                      block2 = block2.replace(f", {token}", "", 1)
                  elif f"{token}, " in block2:
                      block2 = block2.replace(f"{token}, ", "", 1)
                  else:
                      raise SystemExit(f"{key}: unexpected Czech locale placement")

                  if current_line != baseline_line:
                      old_location = f'file="{baseline_path}"\n            line="{baseline_line}"'
                      new_location = f'file="{baseline_path}"\n            line="{current_line}"'
                      if block2.count(old_location) != 1:
                          raise SystemExit(
                              f"{key}: exact stored location {baseline_path}:{baseline_line} "
                              "was not unique inside its issue block"
                          )
                      block2 = block2.replace(old_location, new_location, 1)

                  if text.count(block) < 1:
                      raise SystemExit(f"{key}: selected baseline block disappeared before replacement")
                  text = text.replace(block, block2, 1)
                  idx = blocks.index(block)
                  blocks[idx] = block2
                  changed_blocks += 1

          if changed_blocks != 32:
              raise SystemExit(f"Expected exactly 32 baseline block updates, got {changed_blocks}")

          path.write_text(text, encoding="utf-8")
          print("Updated exactly 32 baseline blocks for 31 Czech strings.")

      - name: Validate diff and remove temporary validation files
        run: |
          git diff --check
          rm .github/workflows/refresh-czech-lint-baseline.yml
          rm -f .ci-trigger
          changed=$(git status --short | sed 's/^...//' | sort)
          expected=$(printf '%s\n' '.ci-trigger' '.github/workflows/refresh-czech-lint-baseline.yml' 'lint-baseline.xml' | sort)
          printf 'Changed paths:\n%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Commit final baseline refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh Czech MissingTranslation lint baseline"
          git push
