name: Refresh Czech lint baseline

on:
  push:
    branches: [ "czech-translation" ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print exact baseline locations for Czech translation keys
        shell: python
        run: |
          from pathlib import Path
          import re

          keys = [
              "battery_optimization_notification_title",
              "battery_optimization_notification_text",
              "permission_braille_display_label",
              "permission_braille_display_description",
              "external_display_channel",
              "external_display_ask_title",
              "external_display_ask_text",
              "external_display_warning",
              "external_display_allow",
              "external_display_deny",
              "external_display_in_use_title",
              "external_display_in_use_text",
              "external_displays_title",
              "external_displays_summary",
              "external_displays_none",
              "title_clear_selection",
              "script_sources",
              "script_sources_none",
              "script_source_add",
              "script_source_add_button",
              "script_source_hint",
              "script_source_invalid",
              "script_source_exists",
              "script_source_loading",
              "script_source_empty",
              "script_source_failed",
              "script_source_retry",
              "script_source_downloading",
              "script_source_remove",
              "script_source_remove_title",
              "script_source_remove_message",
          ]

          text = Path("lint-baseline.xml").read_text(encoding="utf-8")
          blocks = re.findall(r'<issue\b.*?</issue>', text, flags=re.S)

          for key in keys:
              marker = f'message="&quot;{key}&quot; is not translated'
              matches = [b for b in blocks if marker in b]
              print(f"KEY {key} COUNT {len(matches)}")
              for i, block in enumerate(matches, 1):
                  locations = re.findall(r'<location\b[^>]*/>', block, flags=re.S)
                  print(f"  MATCH {i}")
                  for location in locations:
                      compact = ' '.join(location.split())
                      print(f"    {compact}")

          print("Diagnostic only: no files were modified.")
