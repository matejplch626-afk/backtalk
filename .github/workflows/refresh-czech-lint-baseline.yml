name: Refresh Czech lint baseline

on:
  push:
    branches: [ "czech-translation" ]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh exact Czech MissingTranslation baseline entries
        shell: python
        run: |
          from pathlib import Path

          keys = [
              "battery_optimization_notification_title",
              "battery_optimization_notification_text",
              "permission_braille_display_label",
              "permission_braille_display_description",
              "external_display_channel",
              "external_display_ask_title",
              "external_display_ask_text",
              "external_display_warning",
              "external_display_allow",
              "external_display_deny",
              "external_display_in_use_title",
              "external_display_in_use_text",
              "external_displays_title",
              "external_displays_summary",
              "external_displays_none",
              "title_clear_selection",
              "script_sources",
              "script_sources_none",
              "script_source_add",
              "script_source_add_button",
              "script_source_hint",
              "script_source_invalid",
              "script_source_exists",
              "script_source_loading",
              "script_source_empty",
              "script_source_failed",
              "script_source_retry",
              "script_source_downloading",
              "script_source_remove",
              "script_source_remove_title",
              "script_source_remove_message",
          ]

          path = Path("lint-baseline.xml")
          text = path.read_text(encoding="utf-8")
          token = "&quot;cs&quot; (Czech)"
          changed = 0

          for key in keys:
              marker = f'message="&quot;{key}&quot; is not translated'
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{key}: expected exactly one baseline message, found {count}")
              pos = text.find(marker)
              start = text.rfind("<issue", 0, pos)
              end = text.find("</issue>", pos)
              if start < 0 or end < 0:
                  raise SystemExit(f"{key}: issue block not found")
              end += len("</issue>")
              block = text[start:end]
              token_count = block.count(token)
              if token_count != 1:
                  raise SystemExit(f"{key}: expected Czech locale exactly once, found {token_count}")
              if f", {token}" in block:
                  block2 = block.replace(f", {token}", "", 1)
              elif f"{token}, " in block:
                  block2 = block.replace(f"{token}, ", "", 1)
              else:
                  raise SystemExit(f"{key}: unexpected Czech locale placement")
              text = text[:start] + block2 + text[end:]
              changed += 1

          if changed != 31:
              raise SystemExit(f"Expected 31 baseline updates, got {changed}")
          path.write_text(text, encoding="utf-8")
          print(f"Updated {changed} exact MissingTranslation baseline entries")

      - name: Validate patch and remove temporary files
        run: |
          git diff --check
          rm .github/workflows/refresh-czech-lint-baseline.yml
          rm -f .ci-trigger
          git status --short

      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh Czech MissingTranslation lint baseline"
          git push
