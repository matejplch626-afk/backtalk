name: Refresh Czech lint baseline

on:
  push:
    branches: [ "czech-translation" ]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh exact Czech MissingTranslation baseline entries
        shell: python
        run: |
          from pathlib import Path
          import re

          entries = [
              ("battery_optimization_notification_title", "talkback/src/main/res/values/strings.xml"),
              ("battery_optimization_notification_text", "talkback/src/main/res/values/strings.xml"),
              ("permission_braille_display_label", "talkback/src/main/res/values/strings.xml"),
              ("permission_braille_display_description", "talkback/src/main/res/values/strings.xml"),
              ("external_display_channel", "braille/brailledisplay/src/phone/res/values/strings.xml"),
              ("external_display_ask_title", "braille/brailledisplay/src/phone/res/values/strings.xml"),
              ("external_display_ask_text", "braille/brailledisplay/src/phone/res/values/strings.xml"),
              ("external_display_warning", "braille/brailledisplay/src/phone/res/values/strings.xml"),
              ("external_display_allow", "braille/brailledisplay/src/phone/res/values/strings.xml"),
              ("external_display_deny", "braille/brailledisplay/src/phone/res/values/strings.xml"),
              ("external_display_in_use_title", "braille/brailledisplay/src/phone/res/values/strings.xml"),
              ("external_display_in_use_text", "braille/brailledisplay/src/phone/res/values/strings.xml"),
              ("external_displays_title", "braille/brailledisplay/src/phone/res/values/strings.xml"),
              ("external_displays_summary", "braille/brailledisplay/src/phone/res/values/strings.xml"),
              ("external_displays_none", "braille/brailledisplay/src/phone/res/values/strings.xml"),
              ("title_clear_selection", "talkback/src/main/res/values/strings.xml"),
              ("script_sources", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_sources_none", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_add", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_add_button", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_hint", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_invalid", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_exists", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_loading", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_empty", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_failed", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_retry", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_downloading", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_remove", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_remove_title", "talkback/src/main/res/values/strings_scripts.xml"),
              ("script_source_remove_message", "talkback/src/main/res/values/strings_scripts.xml"),
          ]

          path = Path("lint-baseline.xml")
          text = path.read_text(encoding="utf-8")
          token = "&quot;cs&quot; (Czech)"
          changed = 0

          for key, source in entries:
              marker = f'message="&quot;{key}&quot; is not translated'
              blocks = re.findall(r'<issue\b.*?</issue>', text, flags=re.S)
              candidates = [b for b in blocks if marker in b and source in b]
              if len(candidates) != 1:
                  raise SystemExit(f"{key} / {source}: expected exactly one matching baseline block, found {len(candidates)}")
              block = candidates[0]
              token_count = block.count(token)
              if token_count != 1:
                  raise SystemExit(f"{key}: expected Czech locale exactly once, found {token_count}")
              if f", {token}" in block:
                  block2 = block.replace(f", {token}", "", 1)
              elif f"{token}, " in block:
                  block2 = block.replace(f"{token}, ", "", 1)
              else:
                  raise SystemExit(f"{key}: unexpected Czech locale placement")
              if text.count(block) != 1:
                  raise SystemExit(f"{key}: selected issue block is not unique in baseline")
              text = text.replace(block, block2, 1)
              changed += 1

          if changed != 31:
              raise SystemExit(f"Expected 31 baseline updates, got {changed}")
          path.write_text(text, encoding="utf-8")
          print(f"Updated {changed} exact MissingTranslation baseline entries")

      - name: Validate patch and remove temporary files
        run: |
          git diff --check
          rm .github/workflows/refresh-czech-lint-baseline.yml
          rm -f .ci-trigger
          git status --short

      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh Czech MissingTranslation lint baseline"
          git push
