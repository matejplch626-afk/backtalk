name: Czech baseline validation

on:
  push:
    branches: [czech-external-displays]

permissions:
  contents: write

concurrency:
  group: czech-baseline-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # This first lint is intentionally allowed to fail. The existing baseline still contains
      # Czech in these MissingTranslation messages, so lint reports the exact current messages
      # after Czech has been translated. Those messages are our source of truth.
      - name: Produce actual lint report
        run: |
          set +e
          ./gradlew :lintPhoneDebug --console=plain
          status=$?
          echo "Initial lint exit code: $status"
          find . -type f -name 'lint-results-phoneDebug.xml' -print
          exit 0

      - name: Refresh only the exact Czech baseline issues
        id: baseline
        shell: python
        run: |
          import copy
          import html
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          expected = {
              "external_display_channel",
              "external_display_ask_title",
              "external_display_ask_text",
              "external_display_warning",
              "external_display_allow",
              "external_display_deny",
              "external_display_in_use_title",
              "external_display_in_use_text",
              "external_displays_title",
              "external_displays_summary",
              "external_displays_none",
          }
          source = "braille/brailledisplay/src/phone/res/values/strings.xml"
          czech = '"cs" (Czech)'

          reports = []
          for root, dirs, files in os.walk("."):
              if "lint-results-phoneDebug.xml" in files:
                  reports.append(os.path.join(root, "lint-results-phoneDebug.xml"))
          if not reports:
              raise SystemExit("lint-results-phoneDebug.xml was not produced")
          if len(reports) != 1:
              raise SystemExit(f"Expected one phone lint XML report, found: {reports}")

          report_root = ET.parse(reports[0]).getroot()
          baseline_text = open("lint-baseline.xml", encoding="utf-8").read()
          baseline_root = ET.fromstring(baseline_text)

          def key_from(issue):
              if issue.get("id") != "MissingTranslation":
                  return None
              m = re.match(r'"([^"]+)" is not translated in ', issue.get("message", ""))
              return m.group(1) if m else None

          def source_matches(issue):
              loc = issue.find("location")
              if loc is None:
                  return False
              path = (loc.get("file") or "").replace("\\", "/")
              return path == source or path.endswith("/" + source)

          baseline_matches = {}
          report_matches = {}
          for key in expected:
              baseline_matches[key] = [
                  i for i in baseline_root.findall("issue")
                  if key_from(i) == key and source_matches(i)
              ]
              report_matches[key] = [
                  i for i in report_root.findall("issue")
                  if key_from(i) == key and source_matches(i)
              ]
              if len(baseline_matches[key]) != 1:
                  raise SystemExit(
                      f"Expected exactly one baseline issue for {key} + {source}; "
                      f"found {len(baseline_matches[key])}"
                  )

          needs_refresh = {
              key for key, issues in baseline_matches.items()
              if czech in issues[0].get("message", "")
          }

          if not needs_refresh:
              print("All 11 targeted baseline issues are already refreshed for Czech.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("changed=false\n")
              raise SystemExit(0)

          if needs_refresh != expected:
              raise SystemExit(
                  "Partial/unexpected baseline state. Expected either all 11 or none to need "
                  f"refresh; found {sorted(needs_refresh)}"
              )

          for key in sorted(expected):
              if len(report_matches[key]) != 1:
                  raise SystemExit(
                      f"Expected exactly one current lint incident for {key} + {source}; "
                      f"found {len(report_matches[key])}"
                  )
              current = report_matches[key][0]
              if czech in current.get("message", ""):
                  raise SystemExit(f"Czech is still missing according to lint for {key}")

          # Locate raw issue blocks, match by key + exact source file, and replace only those 11.
          # This preserves every unrelated baseline byte-for-byte.
          issue_re = re.compile(r'    <issue\n.*?\n    </issue>', re.S)
          raw_blocks = issue_re.findall(baseline_text)
          replacements = {}

          for block in raw_blocks:
              try:
                  issue = ET.fromstring(block.strip())
              except ET.ParseError:
                  continue
              key = key_from(issue)
              if key not in expected or not source_matches(issue):
                  continue
              if key in replacements:
                  raise SystemExit(f"Duplicate raw baseline block for {key} + {source}")

              old = baseline_matches[key][0]
              cur = report_matches[key][0]
              old_loc = old.find("location")
              cur_loc = cur.find("location")

              def esc(value):
                  return html.escape(value or "", quote=True)

              new_block = (
                  "    <issue\n"
                  f'        id="{esc(old.get("id"))}"\n'
                  f'        message="{esc(cur.get("message"))}"\n'
                  f'        errorLine1="{esc(cur.get("errorLine1"))}"\n'
                  f'        errorLine2="{esc(cur.get("errorLine2"))}">\n'
                  "        <location\n"
                  f'            file="{esc(old_loc.get("file"))}"\n'
                  f'            line="{esc(cur_loc.get("line"))}"\n'
                  f'            column="{esc(cur_loc.get("column"))}"/>\n'
                  "    </issue>"
              )
              replacements[key] = (block, new_block)

          if set(replacements) != expected:
              raise SystemExit(
                  f"Raw baseline match mismatch. Expected {sorted(expected)}, "
                  f"found {sorted(replacements)}"
              )

          updated = baseline_text
          for key in sorted(expected):
              old_block, new_block = replacements[key]
              if updated.count(old_block) != 1:
                  raise SystemExit(f"Raw block for {key} is not unique")
              updated = updated.replace(old_block, new_block, 1)

          open("lint-baseline.xml", "w", encoding="utf-8").write(updated)

          # Semantic safety check: only the 11 exact issues may differ.
          before_root = ET.fromstring(baseline_text)
          after_root = ET.fromstring(updated)

          def signature(issue):
              loc = issue.find("location")
              return (
                  issue.get("id", ""), key_from(issue) or "",
                  (loc.get("file", "") if loc is not None else ""),
                  issue.get("message", ""), issue.get("errorLine1", ""),
                  issue.get("errorLine2", ""),
                  (loc.get("line", "") if loc is not None else ""),
                  (loc.get("column", "") if loc is not None else ""),
              )

          before = [signature(i) for i in before_root.findall("issue")]
          after = [signature(i) for i in after_root.findall("issue")]
          if len(before) != len(after):
              raise SystemExit("Baseline issue count changed")

          changed = []
          for a, b in zip(before, after):
              if a != b:
                  changed.append((a, b))
          if len(changed) != 11:
              raise SystemExit(f"Expected exactly 11 changed baseline issues, got {len(changed)}")
          for old_sig, new_sig in changed:
              key = new_sig[1]
              if key not in expected or new_sig[2] != source:
                  raise SystemExit(f"Unexpected baseline issue changed: {new_sig}")
              if czech in new_sig[3]:
                  raise SystemExit(f"Czech still present after refresh for {key}")

          print("Validated exactly 11 targeted Czech MissingTranslation baseline updates.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("changed=true\n")

      - name: Commit refreshed baseline locally
        if: steps.baseline.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint-baseline.xml
          git commit -m "Refresh lint baseline for Czech external display strings"

      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      - name: Run unit tests
        run: ./gradlew testPhoneDebugUnitTest --console=plain

      - name: Run final lint
        run: ./gradlew :lintPhoneDebug --console=plain

      - name: Push validated baseline
        if: steps.baseline.outputs.changed == 'true'
        run: git push origin HEAD:czech-external-displays
