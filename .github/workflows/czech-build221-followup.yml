name: Czech build 221 follow-up

on:
  push:
    branches: [czech-build221-followup]

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: czech-build221-followup
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply Czech follow-up fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('talkback/src/main/res/values-cs/strings.xml')
          text = p.read_text(encoding='utf-8')

          replacements = {
            'confirm_focus_delay_reading_control_added_dialog_message':
              'Prodlevu po označení teď můžete kdykoli změnit pomocí ovládání čtení.',
            'confirm_typing_focus_delay_reading_control_added_dialog_message':
              'Pokud dvojité klepnutí při psaní nefunguje spolehlivě, můžete kdykoli pomocí ovládání čtení nastavit delší prodlevu po označení při psaní.',
            'gestures_announce_reset_gesture_settings':
              'Nastavení gest byla resetována.',
          }

          for key, value in replacements.items():
              pattern = rf'(<string name="{re.escape(key)}">)(.*?)(</string>)'
              text, count = re.subn(pattern, rf'\g<1>{value}\g<3>', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {key}, found {count}')

          old = '&lt;br&gt;&lt;br&gt;Jak vypnout funkci Backtalk&lt;/b&gt;'
          new = '&lt;br&gt;&lt;br&gt;&lt;b&gt;Jak vypnout funkci Backtalk&lt;/b&gt;'
          if old not in text:
              raise SystemExit('Expected malformed Backtalk HTML heading was not found')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate XML and placeholders
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          en_path = Path('talkback/src/main/res/values/strings.xml')
          cs_path = Path('talkback/src/main/res/values-cs/strings.xml')
          en_root = ET.parse(en_path).getroot()
          cs_root = ET.parse(cs_path).getroot()
          en = {e.attrib.get('name'): ''.join(e.itertext()) for e in en_root if e.tag == 'string' and e.attrib.get('name')}
          cs = {e.attrib.get('name'): ''.join(e.itertext()) for e in cs_root if e.tag == 'string' and e.attrib.get('name')}
          ph = re.compile(r'%(?:\d+\$)?[a-zA-Z]')
          keys = [
            'confirm_focus_delay_reading_control_added_dialog_message',
            'confirm_typing_focus_delay_reading_control_added_dialog_message',
          ]
          for key in keys:
              if sorted(ph.findall(en[key])) != sorted(ph.findall(cs[key])):
                  raise SystemExit(f'Placeholder mismatch in {key}')
          assert cs['confirm_focus_delay_reading_control_added_dialog_message'] == 'Prodlevu po označení teď můžete kdykoli změnit pomocí ovládání čtení.'
          assert cs['gestures_announce_reset_gesture_settings'] == 'Nastavení gest byla resetována.'
          print('Czech XML and targeted placeholders are valid.')
          PY

      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      - name: Commit clean Czech follow-up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/czech-build221-followup.yml
          git add talkback/src/main/res/values-cs/strings.xml .github/workflows/czech-build221-followup.yml
          git commit -m 'Update Czech localization for build 221'
          git push origin HEAD:czech-build221-followup
